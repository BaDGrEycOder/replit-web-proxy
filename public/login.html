<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Hiiii!!!!</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="centered">
  <div class="card">
    <h1>Hiiii!!!!</h1>
    <p class="muted">Choose your sign-in method to continue</p>

    <div class="stack">
      <a href="/auth/google" class="primary google-button" style="display:inline-block;text-align:center;text-decoration:none;">Continue with Google</a>
    </div>

    <form method="POST" action="/login" class="stack">
      <input name="password" type="password" placeholder="Password" required />
      <button type="submit" class="primary">Log in</button>
    </form>

    <p class="muted small">Set the password in Render Environment: <code>PROXY_PASSWORD</code></p>
    <p class="muted small">For Google sign-in, set <code>GOOGLE_CLIENT_ID</code>, <code>GOOGLE_CLIENT_SECRET</code>, and <code>GOOGLE_CALLBACK_URL</code></p>
  </div>
</body>
</html>
