<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - Private Proxy</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="brand">Admin</div>
      <div class="actions">
        <a href="/" class="link">Back</a>
        <a href="/logout" class="link">Log out</a>
      </div>
    </div>
  </header>

  <main class="container page">
    <section class="panel">
      <h2>Allowlist</h2>
      <p class="muted">Edit domains that are allowed to be proxied (one per line).</p>
      <textarea id="allowbox" style="width:100%;height:120px;border-radius:8px;padding:8px"></textarea>
      <div style="margin-top:8px">
        <button id="saveAllow" class="primary">Save</button>
      </div>
    </section>

    <section class="panel">
      <h2>Usage Stats</h2>
      <pre id="statspre" style="white-space:pre-wrap"></pre>
      <button id="refreshStats" class="secondary">Refresh</button>
    </section>
  </main>

  <script>
    async function load(){
      const r = await fetch('/api/admin/allowlist');
      const list = await r.json();
      document.getElementById('allowbox').value = list.join('\n');
    }
    document.getElementById('saveAllow').addEventListener('click', async ()=>{
      const text = document.getElementById('allowbox').value;
      const list = text.split(/\n/).map(s=>s.trim()).filter(Boolean);
      await fetch('/api/admin/allowlist',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({list})});
      alert('Saved');
    });
    document.getElementById('refreshStats').addEventListener('click', async ()=>{
      const r = await fetch('/api/admin/stats');
      const s = await r.json();
      document.getElementById('statspre').textContent = JSON.stringify(s, null, 2);
    });
    load();
  </script>
</body>
</html>
